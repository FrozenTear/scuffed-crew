[workspace]
resolver = "2"
members = [
    # Leptos migration complete (THE-321): legacy site/admin/ui crates removed.
    # The frontend standard is Dioxus; scripts/check-frontend-deps.sh blocks
    # new leptos deps (crates/auth keeps a dormant optional client feature).
    "crates/auth",
    "crates/site-server",
    "crates/db",
    # Dioxus crates
    "crates/types",
    "crates/app",
    "crates/server",
    "crates/api-client",
    # Map pipeline tooling
    "crates/map-pipeline",
    "crates/map-renderer",
    # Nostr relay
    "crates/relay-policy",
    # Nostr chat backend
    "crates/chat",
    # Overwatch stat tracker
    "crates/stat-tracker",
    # Its bottom layer (0.6 N4), re-exported by scuffed-stat-tracker.
    "crates/stat-tracker-core",
    # Iced 0.14 tracker GUI. Binary name: stat-tracker-gui.
    "crates/stat-tracker-ui",
]

[workspace.package]
license = "MIT OR Apache-2.0"

# Line tables keep file:line in backtraces and panics but skip full DWARF
# (types, locals). Debug and test builds link faster and use less disk.
# `test` inherits `dev`. Release profiles below are unchanged.
# rust-cache keys do NOT hash this file's [profile.*] tables: bump
# `prefix-key` in stat-tracker.yml and ci.yml whenever a profile changes.
[profile.dev]
debug = "line-tables-only"

# The tracker's tests are pixel work (blanking, template matching, digit
# reads) that runs 5-6x faster optimized: the lib tests go from about
# 180 s to 34 s on 4 cores, for about 110 s more compile. Only `cargo test`
# uses this; `cargo build` / `cargo run` (dev) stay unoptimized, and so do
# the other crates. Assertions and overflow checks stay on, and line tables
# (from `dev`) keep file:line in panics. For a debuggable test build:
#   cargo test -p scuffed-stat-tracker --config 'profile.test.package.scuffed-stat-tracker.opt-level=0'
[profile.test.package.scuffed-stat-tracker]
opt-level = 2
debug-assertions = true
overflow-checks = true

# Thin LTO: worthwhile binary-size/speed win for the release daemon + server,
# small compile-time cost only on release builds.
[profile.release]
lto = "thin"

# dx `build --release` selects this name for the WASM app (`wasm-release`).
# Native `cargo build --release` stays on `[profile.release]` above.
# dx forces `strip=false` during rustc so the asset pass can see symbols,
# then wasm-opt `--strip-debug` strips the shipped bundle.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
dioxus = "0.7.9"
dioxus-ssr = "0.7.9"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-br", "compression-gzip"] }
reqwest = { version = "0.12", features = ["json"] }
