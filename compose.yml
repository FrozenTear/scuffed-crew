services:
  surrealdb:
    # Contabo day-2 / podman-compose: `up site-server` or `up strfry` may
    # spawn an underscore twin on this same volume. scripts/update.sh and
    # scripts/relay-up.sh use `--no-deps` when a project Surreal is already
    # Up. Do not rename this service or volume key. Do not pin
    # container_name or the compose project name: a hyphen pin collides
    # with the existing hyphen DB, but on a host whose only DB is the
    # underscore name it starts a second container on this volume.
    # x-podman.name_separator_compat would match container names and also
    # rename networks (hyphen vs the existing underscore networks).
    # Fully qualified so podman does not stop on a short-name registry prompt.
    image: docker.io/surrealdb/surrealdb:v3.0
    # Image runs as non-root by default; Podman named volumes are root-owned,
    # which causes: Failed to create RocksDB directory: Permission denied.
    # Run as root in the container for single-tenant VPS deploys.
    user: "0:0"
    environment:
      SURREAL_USER: ${SURREALDB_USER:-root}
      SURREAL_PASS: ${SURREALDB_PASSWORD:?Set SURREALDB_PASSWORD (run scripts/install.sh)}
      SURREAL_BIND: 0.0.0.0:8000
    # Absolute path form (rocksdb:/data/...) so data lands on the volume.
    command: start rocksdb:/data/scuffed.db
    volumes:
      - surrealdb-data:/data
    networks:
      - internal
    # Minimal image: no curl or shell. `is-ready` asks the running server, so
    # this checks the database and not only the binary. The surreal CLI waits
    # about 5s on exit after it has answered (measured on 3.0.5, with `version`
    # too). An older 5s timeout therefore failed every check and the container
    # sat at "unhealthy" while the database was fine. That is also why
    # `is-ready` once looked unreliable. Keep the timeout well above 5s.
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  strfry:
    profiles: ["relay"]
    build:
      context: .
      dockerfile: relay/Containerfile
    # No depends_on. `up strfry` must not create surrealdb. podman-compose
    # names that container with underscores (scuffed-crew_surrealdb_1).
    # Compose v2 uses hyphens (scuffed-crew-surrealdb-1). Both mount
    # ${project}_surrealdb-data. A relay up that honors depends_on started
    # the underscore twin on the live volume; RocksDB's LOCK was the only
    # thing that kept both from writing. scripts/relay-up.sh still passes
    # --no-deps. Start Surreal from the main stack (scripts/update.sh).
    environment:
      SURREALDB_URL: ws://surrealdb:8000
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:?Set SURREALDB_PASSWORD (run scripts/install.sh)}
      SURREALDB_NS: ${SURREALDB_NS:-scuffed_crew}
      SURREALDB_DB: ${SURREALDB_DB:-main}
      # Same flag as site-server. When it is set, relay-policy and the read
      # gate refuse to start on a missing password, root/root, or a loopback
      # SURREALDB_URL. They do not fall back to root/root.
      PRODUCTION: ${PRODUCTION:-}
      # Gate listens here and dials strfry on 127.0.0.1:7777 inside this
      # container. Host 127.0.0.1:7777 is the gate, not raw strfry.
      RELAY_GATE_LISTEN: 0.0.0.0:7779
      RELAY_GATE_UPSTREAM: ws://127.0.0.1:7777
      # strfry sees the gate as 127.0.0.1, so its per-IP limits do not see
      # browsers. The gate limits connections and messages per client IP.
      # X-Forwarded-For is honored only when the TCP peer is loopback or listed
      # here. One substitution only. podman-compose 1.5 does not expand a
      # nested default: if the outer name is set it appends a stray brace,
      # and if it is unset the inner text is passed through. The gate then
      # logs an unparseable entry and ignores it. ${TRUSTED_PROXIES:-}
      # expands in both podman-compose and docker compose. The value is the
      # compose gateway written by scripts/ensure-trusted-proxies.sh. Caddy
      # on the host is that peer. A RELAY_GATE_TRUSTED_PROXIES key in the
      # env file is not read.
      RELAY_GATE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RELAY_GATE_MAX_CONN_PER_IP: ${RELAY_GATE_MAX_CONN_PER_IP:-32}
      RELAY_GATE_CONN_RATE: ${RELAY_GATE_CONN_RATE:-60}
      RELAY_GATE_MSG_RATE: ${RELAY_GATE_MSG_RATE:-240}
      RELAY_GATE_RATE_WINDOW_SECS: ${RELAY_GATE_RATE_WINDOW_SECS:-60}
      # Default on. An h tag must name an active team channel, and the author
      # must be on that team's roster. Kind 1059 gift wraps have no h tag.
      RELAY_POLICY_ENFORCE_GROUPS: ${RELAY_POLICY_ENFORCE_GROUPS:-true}
    volumes:
      - strfry-data:/app/strfry-db
    networks:
      - internal
      - external
    # Host port 7777 is the read gate (container 7779). Container port 7777
    # is strfry itself and stays on the Compose network so site-server can
    # use ws://strfry:7777. Do not publish 7777:7777; that would skip the gate.
    ports:
      - "127.0.0.1:7777:7779"
    restart: unless-stopped

  site-server:
    # Prefer prebuilt GHCR image (CI publishes on main). Override with SITE_SERVER_IMAGE.
    # Local rebuild: BUILD_FROM_SOURCE=1 ./scripts/install.sh  or  podman compose ... up --build
    image: ${SITE_SERVER_IMAGE:-ghcr.io/frozentear/scuffed-crew:main}
    build:
      context: .
      dockerfile: Containerfile
    # Plain list form: most compatible with docker-compose under podman.
    depends_on:
      - surrealdb
    environment:
      SURREALDB_URL: ws://surrealdb:8000
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:?Set SURREALDB_PASSWORD (run scripts/install.sh)}
      SURREALDB_NS: ${SURREALDB_NS:-scuffed_crew}
      SURREALDB_DB: ${SURREALDB_DB:-main}
      # Prefer scoped DB user in production (root still works for single-tenant VPS).
      # Production default: scoped app user (root only used at bootstrap to DEFINE USER).
      SURREALDB_AUTH_MODE: ${SURREALDB_AUTH_MODE:-scoped}
      SURREALDB_APP_USER: ${SURREALDB_APP_USER:-scuffed_app}
      # Single level. podman-compose 1.5 mangles a nested fallback. When this
      # is blank, scripts/lib/compose-env.sh copies SURREALDB_PASSWORD before
      # compose runs. install.sh and update.sh still write a distinct app
      # password into secrets.env when the key is missing. Production rejects
      # an app password equal to the root password.
      SURREALDB_APP_PASSWORD: ${SURREALDB_APP_PASSWORD:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Public origin only. A path or query is ignored. The AUTH allow-list
      # adds wss://host/relay for an https base, or ws://host/relay for http.
      REDIRECT_BASE_URL: ${REDIRECT_BASE_URL:-http://127.0.0.1:3000}
      # Single level. A nested fallback to REDIRECT_BASE_URL is what
      # podman-compose 1.5 turns into a stray brace or a literal. When
      # ALLOWED_ORIGINS is blank, scripts/lib/compose-env.sh sets it from
      # REDIRECT_BASE_URL before compose runs (F-API-004). Do not pass an
      # empty value: that used to 403 browser strategy WS / CORS. This
      # static default applies only when that export did not run.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      NOSTR_RELAY_URL: ${NOSTR_RELAY_URL:-}
      # Public domain serving /.well-known/nostr.json — the right-hand side of
      # members' NIP-05 identifiers. Unset (or loopback/IP/private) means kind-0
      # profiles publish WITHOUT a nip05 field, which is deliberate: those events
      # are immutable on relays, so an identity pointing at a domain we don't
      # control breaks verification permanently and is hijackable.
      NIP05_DOMAIN: ${NIP05_DOMAIN:-}
      # Arms POST /api/admin/nostr/republish-profiles (admin-only, dry-run by
      # default). Leave unset. Set to exactly "1" only while deliberately
      # repairing kind-0 events that carry an old domain, then unset again.
      NIP05_REPUBLISH_ENABLED: ${NIP05_REPUBLISH_ENABLED:-}
      # Required outside dev — server refuses to boot without it (no public dev-key
      # fallback). install.sh/update.sh generate it into data/secrets.env.
      NOSTR_CHALLENGE_SECRET: ${NOSTR_CHALLENGE_SECRET:-}
      UPLOAD_DIR: /app/data/uploads
      # Private member bug-report zips. The entrypoint gives this path to scuffed.
      REPORTS_DIR: /app/data/reports
      # Private recognizer packs. Read-only. See docs/tracker-packs.md.
      PACKS_DIR: /app/data/packs
      # Rate-limiter trusted proxies (comma-separated IPs/CIDRs). Forwarded
      # headers are honored only from loopback plus this list. The default in
      # the app is loopback only — do not leave this empty in production.
      # Host Caddy → 127.0.0.1:HOST_PORT shows up inside this container as the
      # compose-network gateway. scripts/ensure-trusted-proxies.sh writes that
      # gateway into data/secrets.env (see docs/deploy.md).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Strategy collab WebSocket caps (/api/strategy/ws). See .env.example.
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-512}
      WS_MAX_PER_IP: ${WS_MAX_PER_IP:-32}
      PRODUCTION: ${PRODUCTION:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      # Off when unset, empty, 0, false, no, or off. Any other value makes
      # POST /api/stats/upload reject more than 200 matches or 500 deleted
      # sessions with 413. Leave this blank until tracker builds that send
      # at most those sizes and handle 413 are in use. The per-token 429,
      # the per-IP 429 (burst 40, then 1 every 2 seconds, body includes
      # "code":"rate_limited"), and token_expired 401 do not depend on this flag.
      STATS_UPLOAD_BATCH_CAP: ${STATS_UPLOAD_BATCH_CAP:-}
      BOOTSTRAP_ADMIN_RESET: ${BOOTSTRAP_ADMIN_RESET:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - uploads-data:/app/data/uploads
      - reports-data:/app/data/reports
      - packs-data:/app/data/packs:ro
    networks:
      - internal
      - external
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    restart: unless-stopped

networks:
  internal:
    internal: true
  external:

volumes:
  surrealdb-data:
  uploads-data:
  reports-data:
  packs-data:
  strfry-data:
