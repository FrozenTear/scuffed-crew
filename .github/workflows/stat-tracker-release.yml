name: Stat Tracker Release

# Prebuilt Linux binaries for the stat tracker, published as a GitHub Release.
# Trigger: push a tag like `stat-tracker-v0.1.0`, or run manually.
# workflow_dispatch always builds the tarball from the chosen ref. It creates
# a draft GitHub release and tag only when the publish input is true (default
# false). Without publish, the tarball and .sha256 are uploaded as the
# artifact stat-tracker-linux-x86_64-test. Tag pushes publish as before.
#
# Portability strategy (release must run on most Linux distros):
# - Daemon builds on ubuntu-22.04 → glibc floor 2.35 (covers Ubuntu 22.04+,
#   Debian 12+, Fedora, Arch, openSUSE, RHEL 9+, Linux Mint 21).
# - The daemon links a pinned Tesseract 5.5.3 built on this runner (OpenMP
#   on, no -march=native, no libcurl, no libarchive, SONAME
#   libtesseract.so.5). Leptonica stays Ubuntu 22.04's 1.82. The koverwatch
#   model is still trained with the distro Tesseract 4.1.1 tools.
# - tesseract/leptonica sonames are fragmented across distros (Ubuntu ships
#   liblept.so.5, Arch libleptonica.so.6), so the OCR library closure is
#   BUNDLED into lib/scuffed-stat-tracker/ocr (daemon RUNPATH
#   $ORIGIN/../lib/scuffed-stat-tracker/ocr). GUI libxdo lives in
#   lib/scuffed-stat-tracker/gui so OCR deps never sit on the GUI RUNPATH.
#   glibc / toolchain / compositor / OpenSSL stay host-provided. Never
#   bundle libcrypto/libssl (v0.4.0 shadowed system OpenSSL on Aerynos).
# - The GUI is Iced 0.14 (wgpu) + GTK tray from crates/stat-tracker-ui.
#   Built on ubuntu-22.04 (glibc 2.35 floor, same as the daemon).
#   Host still provides Vulkan/GTK/Wayland or X11.
# - Clean-room proof: the daemon job uninstalls the OCR packages after the
#   build and runs the staged binary purely from the bundled libs.

on:
  push:
    tags:
      - "stat-tracker-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: create a draft GitHub release and tag
        type: boolean
        default: false

# Read-only by default. The build jobs compile every crates.io build script
# and run third-party actions, so they get no write token. Only
# package-release, which runs `gh release create`, gets contents: write.
# actions/cache, rust-cache and upload/download-artifact use the runner's
# cache/artifact token, not GITHUB_TOKEN, so they need no `actions` scope
# (publish-image.yml has written its GHA build cache under contents: read
# plus packages: write all along).
permissions:
  contents: read

# One run per ref. A tag pushed again (rc.5 was pushed twice, and the second
# run failed on "release already exists") cancels the older run before it
# can publish, so the newest push of a tag is the one that builds.
concurrency:
  group: stat-tracker-release-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE: scuffed-stat-tracker-linux-x86_64

jobs:
  build-daemon:
    name: Daemon (ubuntu-22.04, glibc 2.35 floor)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # Job env, not GITHUB_ENV: actions/cache reads ${{ env.* }} before
      # a step can append to GITHUB_ENV. Outside the checkout so a local
      # run of the build script (default $HOME/.local/...) is unaffected.
      TESSERACT_PREFIX: /home/runner/.local/tesseract-5.5.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml versions
        if: startsWith(github.ref, 'refs/tags/stat-tracker-v')
        run: bash crates/stat-tracker/dist/check-tag-version.sh

      - name: Install system dependencies
        run: |
          set -euo pipefail
          # A dead mirror must fail the job in minutes, not hang it (alpha.5).
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          # A release must not bundle libraries from stale lists, so a
          # failed update stays fatal; a passing hiccup (a runner repo that
          # answers 403 once) gets one retry.
          sudo timeout 300 apt-get "${APT_OPTS[@]}" update \
            || { sleep 15; sudo timeout 300 apt-get "${APT_OPTS[@]}" update; }
          sudo timeout 600 apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libegl-dev libgbm-dev \
            tesseract-ocr tesseract-ocr-eng libleptonica-dev libtiff-dev \
            build-essential cmake \
            libevdev-dev libudev-dev \
            fontconfig unzip \
            pkg-config patchelf ca-certificates curl
          # libtesseract-dev is the 4.1.1 headers. Do not install it: the
          # daemon links the pinned 5.5.3 prefix. tesseract-ocr stays so
          # training can keep using the 4.1.1 tools.

      - name: Cache pinned Tesseract 5.5.3
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TESSERACT_PREFIX }}
          key: tesseract-5.5.3-lept182-ubuntu2204-openmp-soname5-${{ hashFiles('crates/stat-tracker/dist/build-tesseract.sh') }}

      - name: Build pinned Tesseract 5.5.3
        run: |
          set -euo pipefail
          # The script defaults to 2 jobs. This runner can use its cores.
          TESSERACT_BUILD_JOBS="$(nproc)" bash crates/stat-tracker/dist/build-tesseract.sh
          echo "PKG_CONFIG_PATH=${TESSERACT_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: daemon-2204-tesseract-5.5.3

      - name: Set release version env
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == stat-tracker-v* ]]; then
            V="${GITHUB_REF_NAME#stat-tracker-v}"
          else
            V="dev-${GITHUB_SHA::8}"
          fi
          echo "SST_RELEASE_VERSION=${V}"
          echo "SST_RELEASE_VERSION=${V}" >> "$GITHUB_ENV"

      - name: Build daemon (release)
        working-directory: crates/stat-tracker
        run: |
          set -euo pipefail
          pkg-config --modversion tesseract | grep -qx '5.5.3'
          cargo build --release --locked --bin scuffed-stat-tracker

      - name: Bundle OCR library closure + set RPATH
        run: |
          set -euo pipefail
          mkdir -p out/bin out/lib/scuffed-stat-tracker/ocr
          cp target/release/scuffed-stat-tracker out/bin/
          needed="$(readelf -d out/bin/scuffed-stat-tracker | awk -F'[][]' '/NEEDED/ && /libtesseract/ {print $2; exit}')"
          echo "daemon NEEDED ${needed}"
          [ "${needed}" = "libtesseract.so.5" ]
          # Seed the closure from the binary: pulls tesseract, leptonica, image
          # codecs, and their transitive deps with consistent versions. ldd
          # only sees the pinned 5.5.3 library while LD_LIBRARY_PATH is set.
          # That variable is not written to GITHUB_ENV. Shared script also
          # bundles/stamps for the GUI job (libxdo). OpenSSL is denied.
          # Never land libcrypto/libssl on a RUNPATH.
          LD_LIBRARY_PATH="${TESSERACT_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            bash crates/stat-tracker/dist/bundle-native-libs.sh \
            out/bin/scuffed-stat-tracker out/lib/scuffed-stat-tracker/ocr
          if find out/lib \( -name 'libcrypto.so*' -o -name 'libssl.so*' -o -name 'libcurl.so*' -o -name 'libarchive.so*' \) | grep -q .; then
            echo "refusing to ship OpenSSL, libcurl, or libarchive in the daemon bundle" >&2
            find out/lib \( -name 'libcrypto.so*' -o -name 'libssl.so*' -o -name 'libcurl.so*' -o -name 'libarchive.so*' \)
            exit 1
          fi
          if ! find out/lib/scuffed-stat-tracker/ocr -name 'libtesseract.so.5' | grep -q .; then
            echo "bundle is missing libtesseract.so.5" >&2
            find out/lib/scuffed-stat-tracker/ocr -type f >&2 || true
            exit 1
          fi
          if find out/lib -name 'libtesseract.so.4*' | grep -q .; then
            echo "bundle still contains libtesseract.so.4" >&2
            find out/lib -name 'libtesseract.so.4*' >&2
            exit 1
          fi
          patchelf --set-rpath '$ORIGIN/../lib/scuffed-stat-tracker/ocr' \
            out/bin/scuffed-stat-tracker

      - name: Train koverwatch OCR model (production code path)
        run: |
          set -euo pipefail
          # Runs setup::ensure_koverwatch_tessdata via the staged release
          # binary (RPATH already points at the bundled libtesseract.so.5).
          # The training tools themselves stay Ubuntu 22.04's Tesseract 4.1.1:
          # the 5.5.3 prefix is not on PATH. Must happen on THIS runner (22.04
          # pango works; pango >= 1.56 hosts hang/segfault text2image) and
          # BEFORE the clean-room step below uninstalls the training tools.
          unset LD_LIBRARY_PATH
          tess_bin="$(command -v tesseract)"
          echo "training tesseract: ${tess_bin}"
          case "${tess_bin}" in
            "${TESSERACT_PREFIX}"/*)
              echo "training picked the Tesseract 5 prefix binary; PATH must stay on the Ubuntu 4.1.1 tools" >&2
              exit 1
              ;;
          esac
          tesseract --version >tesseract-train-version.txt 2>&1 || true
          cat tesseract-train-version.txt
          grep -q 'tesseract 4.1.1' tesseract-train-version.txt \
            || { echo "training must use Ubuntu tesseract 4.1.1" >&2; exit 1; }
          ./out/bin/scuffed-stat-tracker --generate-tessdata 2>&1 | tee train.log
          # ensure_koverwatch_tessdata tolerates skipped pages; a release model
          # must not silently train on a subset — fail on any page skip.
          if grep -qE 'text2image (failed|timed out)|produced no output|lstm\.train failed' train.log; then
            echo "training skipped one or more pages — refusing to ship a partial model" >&2
            exit 1
          fi
          MODEL="$HOME/.local/share/scuffed-stat-tracker/tessdata/koverwatch.traineddata"
          [ -f "$MODEL" ] || { echo "koverwatch.traineddata not produced" >&2; exit 1; }
          SIZE=$(stat -c%s "$MODEL")
          # LSTM fine-tune of the ~15MB float eng model; a tiny file means a
          # broken download or legacy-pipeline fallback output.
          [ "$SIZE" -ge 10000000 ] || { echo "koverwatch.traineddata too small: ${SIZE} bytes" >&2; exit 1; }
          mkdir -p out/tessdata
          cp "$MODEL" out/tessdata/
          echo "koverwatch.traineddata trained: ${SIZE} bytes"

      - name: Clean-room smoke test (no system OCR libs)
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          sudo apt-get remove -y libtesseract-dev 'libtesseract*' libleptonica-dev 'liblept*' tesseract-ocr || true
          sudo apt-get autoremove -y || true
          out="$(./out/bin/scuffed-stat-tracker --version)"
          echo "smoke: ${out}"
          echo "${out}" | grep -qx "scuffed-stat-tracker ${SST_RELEASE_VERSION}" \
            || { echo "version mismatch: got '${out}', want scuffed-stat-tracker ${SST_RELEASE_VERSION}" >&2; exit 1; }
          echo "daemon runs with bundled OCR libs only"
          ldd ./out/bin/scuffed-stat-tracker | grep -iE 'tesseract|lept' || true
          tess_line="$(ldd ./out/bin/scuffed-stat-tracker | awk '/libtesseract\.so/ {print}')"
          echo "libtesseract: ${tess_line}"
          printf '%s\n' "${tess_line}" | grep -q 'libtesseract\.so\.5' \
            || { echo "daemon did not request libtesseract.so.5" >&2; exit 1; }
          if printf '%s\n' "${tess_line}" | grep -q 'libtesseract\.so\.4'; then
            echo "daemon still loads libtesseract.so.4" >&2
            exit 1
          fi
          tess_path="$(ldd ./out/bin/scuffed-stat-tracker | awk '/libtesseract\.so\.5/ {print $3; exit}')"
          tess_real="$(realpath "${tess_path:-/nonexistent}" 2>/dev/null || true)"
          bundle_dir="$(realpath ./out/lib/scuffed-stat-tracker/ocr)"
          case "${tess_real}" in
            "${bundle_dir}"/*) echo "libtesseract.so.5 resolves to the bundled copy" ;;
            *)
              echo "libtesseract.so.5 did not resolve to the bundle (got: ${tess_real:-missing}, want prefix: ${bundle_dir}/)" >&2
              exit 1
              ;;
          esac
          bash crates/stat-tracker/dist/check-bundled-glibc.sh 2.35 \
            ./out/bin/scuffed-stat-tracker \
            ./out/lib/scuffed-stat-tracker/ocr
          crypto_line="$(ldd ./out/bin/scuffed-stat-tracker | awk '/libcrypto\.so/ {print $3; exit}')"
          echo "libcrypto resolves to: ${crypto_line:-<none>}"
          case "${crypto_line:-}" in
            */out/lib/*|*/scuffed-stat-tracker/*)
              echo "libcrypto must not resolve from the bundle (got: ${crypto_line})" >&2
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon
          path: out/
          if-no-files-found: error

  build-gui:
    name: GUI (ubuntu-22.04, Iced + GTK tray)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml versions
        if: startsWith(github.ref, 'refs/tags/stat-tracker-v')
        run: bash crates/stat-tracker/dist/check-tag-version.sh

      - name: Install system dependencies
        run: |
          set -euo pipefail
          # A dead mirror must fail the job in minutes, not hang it (alpha.5).
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          # A release must not bundle libraries from stale lists, so a
          # failed update stays fatal; a passing hiccup (a runner repo that
          # answers 403 once) gets one retry.
          sudo timeout 300 apt-get "${APT_OPTS[@]}" update \
            || { sleep 15; sudo timeout 300 apt-get "${APT_OPTS[@]}" update; }
          sudo timeout 600 apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libegl-dev libgbm-dev \
            tesseract-ocr libtesseract-dev libleptonica-dev \
            libevdev-dev libudev-dev \
            libasound2-dev libvulkan-dev libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev \
            pkg-config patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gui-iced-2204

      - name: Set release version env
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == stat-tracker-v* ]]; then
            V="${GITHUB_REF_NAME#stat-tracker-v}"
          else
            V="dev-${GITHUB_SHA::8}"
          fi
          echo "SST_RELEASE_VERSION=${V}"
          echo "SST_RELEASE_VERSION=${V}" >> "$GITHUB_ENV"

      - name: Build GUI (release)
        run: cargo build --release --locked -p scuffed-stat-tracker-ui --bin stat-tracker-gui

      - name: Bundle libxdo + set RPATH
        run: |
          set -euo pipefail
          mkdir -p out/bin out/lib/scuffed-stat-tracker/gui
          cp target/release/stat-tracker-gui out/bin/
          # Iced + tray-icon still need GTK / Vulkan / X11 from the host. We
          # bundle ONLY the soname-fragmented lib the GUI can't get on Arch:
          # libxdo (Ubuntu ships libxdo.so.3, Arch libxdo.so.4). Its transitive
          # deps are the ABI-stable X11/xcb libs — denied so they stay
          # host-provided. OCR closure is NOT on this RUNPATH.
          xdo="$(ldd out/bin/stat-tracker-gui | awk '/libxdo/ {print $3}')"
          [ -n "${xdo}" ] || { echo "libxdo not found in GUI deps" >&2; exit 1; }
          cp -n "${xdo}" out/lib/scuffed-stat-tracker/gui/
          bash crates/stat-tracker/dist/bundle-native-libs.sh \
            "out/lib/scuffed-stat-tracker/gui/$(basename "${xdo}")" \
            out/lib/scuffed-stat-tracker/gui '^libX|^libxcb'
          if find out/lib -name 'libcrypto.so*' -o -name 'libssl.so*' | grep -q .; then
            echo "refusing to ship OpenSSL in the GUI bundle" >&2
            find out/lib -name 'libcrypto.so*' -o -name 'libssl.so*'
            exit 1
          fi
          patchelf --set-rpath '$ORIGIN/../lib/scuffed-stat-tracker/gui' \
            out/bin/stat-tracker-gui

      - name: Clean-room ldd check (bundled libxdo, no system libxdo)
        run: |
          set -euo pipefail
          # Remove host libxdo so the RPATH must resolve it from the bundle.
          sudo apt-get remove -y 'libxdo*' libxdo-dev xdotool || true
          sudo apt-get autoremove -y || true
          echo "GUI ldd from extracted layout:"
          ldd ./out/bin/stat-tracker-gui || true
          if ldd ./out/bin/stat-tracker-gui | grep -i 'not found'; then
            echo "GUI has unresolved libraries after bundling" >&2
            exit 1
          fi
          xdo_line="$(ldd ./out/bin/stat-tracker-gui | awk '/libxdo/ {print $3}')"
          echo "libxdo resolves to: ${xdo_line}"
          # The loader reports the RUNPATH path unnormalized (out/bin/../lib/…),
          # so realpath both sides before comparing.
          xdo_real="$(realpath "${xdo_line:-/nonexistent}" 2>/dev/null || true)"
          bundle_dir="$(realpath ./out/lib/scuffed-stat-tracker/gui)"
          case "${xdo_real}" in
            "${bundle_dir}"/*) echo "libxdo resolves to the bundled copy — OK" ;;
            *) echo "libxdo did NOT resolve to the bundled copy (got: ${xdo_real:-missing}, want prefix: ${bundle_dir}/)" >&2; exit 1 ;;
          esac
          crypto_line="$(ldd ./out/bin/stat-tracker-gui | awk '/libcrypto\.so/ {print $3; exit}')"
          echo "libcrypto resolves to: ${crypto_line:-<none>}"
          case "${crypto_line:-}" in
            */out/lib/*|*/scuffed-stat-tracker/*)
              echo "libcrypto must not resolve from the bundle (got: ${crypto_line})" >&2
              exit 1
              ;;
          esac
          # --help exits without opening a window (Iced CLI). Not a display
          # smoke test — just proves the binary starts and parses flags.
          ./out/bin/stat-tracker-gui --help | grep -q 'stat-tracker-gui' \
            || { echo "stat-tracker-gui --help did not print usage" >&2; exit 1; }
          # A running app runs the installed one with --build-id to see
          # whether an update changed it (G3). It exits before any window.
          ./out/bin/stat-tracker-gui --build-id | grep -Eqx '[0-9a-f]{64}' \
            || { echo "stat-tracker-gui --build-id did not print a build id" >&2; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui
          path: out/
          if-no-files-found: error

  package-release:
    name: Package & Release
    needs: [build-daemon, build-gui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job with a write token: gh release create (and, for a manual
    # publish, the tag gh mints with --target).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gh uses GH_TOKEN below; git itself never pushes.
          persist-credentials: false
          # Full history: release notes diff against the previous
          # stat-tracker-v* tag, which a depth-1 clone doesn't have.
          fetch-depth: 0

      - name: Tag matches Cargo.toml versions
        if: startsWith(github.ref, 'refs/tags/stat-tracker-v')
        run: bash crates/stat-tracker/dist/check-tag-version.sh

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daemon
          path: daemon

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gui
          path: gui

      - name: Packaging unit checks (OpenSSL deny + isolated lib dirs)
        # alpha.5 hung here for 50 min. Each script is named and capped so the
        # next hang fails fast and says which one.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for t in test-packaging test-uninstall-paths test-desktop-entry \
                   test-systemd-unit test-release-notes test-stage-assets \
                   test-tag-version; do
            echo "::group::${t}.sh"
            echo "running ${t}.sh"
            rc=0
            timeout 300 bash "crates/stat-tracker/dist/${t}.sh" || rc=$?
            echo "::endgroup::"
            if [ "${rc}" -ne 0 ]; then
              echo "::error::${t}.sh failed (exit ${rc}; 124 means it timed out)"
              exit "${rc}"
            fi
          done

      - name: Assemble tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#stat-tracker-v}"
          [ "${GITHUB_REF_NAME}" = "${VERSION}" ] && VERSION="dev-${GITHUB_SHA::8}"
          mkdir -p "${STAGE}/bin" "${STAGE}/lib/scuffed-stat-tracker"
          cp daemon/bin/scuffed-stat-tracker "${STAGE}/bin/"
          cp gui/bin/stat-tracker-gui "${STAGE}/bin/"
          if [ -d daemon/lib/scuffed-stat-tracker/ocr ]; then
            cp -a daemon/lib/scuffed-stat-tracker/ocr \
              "${STAGE}/lib/scuffed-stat-tracker/"
          fi
          if [ -d gui/lib/scuffed-stat-tracker/gui ]; then
            cp -a gui/lib/scuffed-stat-tracker/gui \
              "${STAGE}/lib/scuffed-stat-tracker/"
          fi
          if find "${STAGE}/lib" \( -name 'libcrypto.so*' -o -name 'libssl.so*' \) | grep -q .; then
            echo "refusing to ship OpenSSL in the release tarball" >&2
            find "${STAGE}/lib" \( -name 'libcrypto.so*' -o -name 'libssl.so*' \)
            exit 1
          fi
          # Digit templates are include_bytes! in the daemon. install.sh does
          # not install assets/shadow-digits, so they stay out of the tarball.
          bash crates/stat-tracker/dist/stage-release-assets.sh "${STAGE}/assets"
          cp crates/stat-tracker/dist/install.sh "${STAGE}/install.sh"
          cp crates/stat-tracker/dist/uninstall.sh "${STAGE}/uninstall.sh"
          cp crates/stat-tracker/dist/install-paths.sh "${STAGE}/install-paths.sh"
          # Session import helper + ExecStart rewriter. install.sh sources
          # systemd-unit.sh and installs import-session-env.sh under PREFIX.
          cp crates/stat-tracker/dist/import-session-env.sh "${STAGE}/import-session-env.sh"
          cp crates/stat-tracker/dist/systemd-unit.sh "${STAGE}/systemd-unit.sh"
          # Bundle the runtime eng model (tessdata_fast, ~4MB) so the daemon's
          # user tessdata dir is populated with no host apt/pacman step. The app
          # checks ~/.local/share/scuffed-stat-tracker/tessdata FIRST, so
          # install.sh drops this file there (without clobbering a user model).
          mkdir -p "${STAGE}/tessdata"
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 300 \
            https://github.com/tesseract-ocr/tessdata_fast/raw/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata \
            -o "${STAGE}/tessdata/eng.traineddata"
          # Game-font model trained in the daemon job (see "Train koverwatch
          # OCR model"). Required: end-user machines cannot train it themselves
          # (text2image is broken on pango >= 1.56 hosts).
          cp daemon/tessdata/koverwatch.traineddata "${STAGE}/tessdata/"
          chmod +x "${STAGE}/install.sh" "${STAGE}/uninstall.sh" \
            "${STAGE}/import-session-env.sh" "${STAGE}"/bin/*
          echo "${VERSION}" > "${STAGE}/VERSION"
          tar czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Upload test tarball
        # Manual runs default to no release and no tag. The tarball is still
        # built above. Tag pushes and publish=true skip this and use gh release.
        if: ${{ !(startsWith(github.ref, 'refs/tags/stat-tracker-v') || inputs.publish == true) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stat-tracker-linux-x86_64-test
          path: |
            ${{ env.STAGE }}.tar.gz
            ${{ env.STAGE }}.tar.gz.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/stat-tracker-v') || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            EXTRA_FLAGS=""
          else
            # Manual runs publish a draft; --target lets gh mint the tag itself.
            TAG="stat-tracker-manual-${GITHUB_SHA::8}"
            EXTRA_FLAGS="--draft --target ${GITHUB_SHA}"
          fi
          # Alphas and RCs are not production releases: pre-release badge, never "Latest".
          case "${TAG}" in
            *-rc*|*-alpha*) EXTRA_FLAGS="${EXTRA_FLAGS} --prerelease" ;;
          esac
          bash crates/stat-tracker/dist/release-notes.sh --tag "${TAG}" > release-notes.md
          gh release create "${TAG}" ${EXTRA_FLAGS} \
            --title "Stat Tracker ${TAG#stat-tracker-}" \
            --notes-file release-notes.md \
            "${STAGE}.tar.gz" \
            "${STAGE}.tar.gz.sha256"
