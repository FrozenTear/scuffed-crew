name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "wip/0.6"]

# A new push to a PR cancels that PR's older run. Pushes to main group by
# commit SHA and never cancel: publish-image.yml publishes only main commits
# whose CI push run succeeded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  dep-guardrails:
    name: Dependency Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for non-standard frontend deps
        run: bash scripts/check-frontend-deps.sh
      - name: Check design tokens (no raw colors / legacy vars in app CSS)
        run: bash scripts/check-design-tokens.sh
      - name: Check compose files for nested interpolation
        run: bash scripts/check-compose-interpolation.sh
      - name: Check SurrealDB server image matches the surrealdb crate
        run: bash scripts/check-surrealdb-version.sh
      - name: Check compose passes every server env var to site-server
        run: bash scripts/check-compose-env.sh
      - name: Deploy scripts never recreate the database (stubbed podman)
        run: bash scripts/test-surreal-guard.sh
      - name: Backup secret restore checks
        run: |
          bash scripts/test-backup-secrets.sh
          bash scripts/test-restic-access.sh
      - name: Pack publish script checks (fake packs, no server)
        run: bash scripts/test-publish-packs.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # +15 min over the old cap: on a crawling mirror a cache miss may spend
    # up to ~30 min in apt (update 2 x 300 s, install 2 x 600 s).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Offline from cached .debs when it can, else the mirror with retries
      # and timeouts (.github/actions/apt-install). CI runs on main only.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          packages: >-
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache hashes member manifests + Cargo.lock only, NOT the root
          # Cargo.toml [profile.*] tables. Bump this whenever a root profile
          # changes, or a full-match restore of stale artifacts skips the
          # save and every run rebuilds (v0 -> v1: dev line-tables-only).
          prefix-key: v1-rust

      - name: Clippy (native crates)
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --exclude scuffed-app \
            --exclude scuffed-stat-tracker \
            --exclude scuffed-stat-tracker-core \
            --exclude scuffed-stat-tracker-ui \
            -- -D warnings

      - name: Clippy (WASM crates)
        run: |
          cargo clippy \
            --target wasm32-unknown-unknown \
            --all-targets \
            -p scuffed-app \
            -- -D warnings

      - name: Clippy (api-client, native)
        run: |
          cargo clippy \
            -p scuffed-api-client \
            --no-default-features \
            --features native \
            --all-targets \
            -- -D warnings

  # Decides whether the site jobs run. Do not switch this workflow to
  # pull_request paths or paths-ignore: a workflow that never starts leaves
  # required checks pending. A job skipped by `if:` still reports, and GitHub
  # treats that skip as success.
  #
  # pull_request: run the site jobs unless every changed path is tracker-only.
  # Tracker-only paths:
  #   crates/stat-tracker/**, crates/stat-tracker-core/**,
  #   crates/stat-tracker-ui/**,
  #   docs/notes/stat-tracker-*, docs/superpowers/plans/*stat-tracker*
  # Anything else runs the site jobs, including workspace Cargo.toml,
  # Cargo.lock, crates/types, the app, db, server crates, .github/**,
  # deploy files, rust-toolchain, and docs that also describe the site
  # (docs/tracker-packs.md, the stats UI notes).
  # push and every event that is not pull_request always run the site jobs.
  # If this job fails, the site jobs still run.
  changes:
    name: Site changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.gate.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether site jobs run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          site_true() {
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "site=true ($1)"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            site_true "event is ${EVENT_NAME}"
            exit 0
          fi

          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            site_true "pull request base sha missing"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            site_true "base commit not in clone"
            exit 0
          fi

          tracker_only() {
            case "$1" in
              crates/stat-tracker/*|\
              crates/stat-tracker-core/*|\
              crates/stat-tracker-ui/*|\
              docs/notes/stat-tracker-*|\
              docs/superpowers/plans/*stat-tracker*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          diff_file="$(mktemp)"
          if ! git diff -z --name-status --find-renames "${BASE_SHA}...HEAD" > "$diff_file"; then
            site_true "git diff failed"
            exit 0
          fi

          site=false
          saw=false
          while IFS= read -r -d '' status; do
            saw=true
            case "$status" in
              R*|C*)
                IFS= read -r -d '' path1 || true
                IFS= read -r -d '' path2 || true
                pair=("$path1" "$path2")
                ;;
              *)
                IFS= read -r -d '' path1 || true
                pair=("$path1")
                ;;
            esac
            for p in "${pair[@]}"; do
              [ -n "$p" ] || continue
              if tracker_only "$p"; then
                printf 'tracker-only: %s\n' "$p"
              else
                site=true
                printf 'site-relevant: %s\n' "$p"
              fi
            done
          done < "$diff_file"

          if [ "$saw" != true ]; then
            site_true "empty diff"
            exit 0
          fi

          echo "site=${site}" >> "$GITHUB_OUTPUT"
          echo "site=${site}"

  build-and-test:
    name: Build & Test
    needs: changes
    # Skipped when a pull request is tracker-only. A failed changes job
    # still runs this job. Cancellation still skips it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    # +15 min over the old cap: on a crawling mirror a cache miss may spend
    # up to ~30 min in apt (update 2 x 300 s, install 2 x 600 s).
    timeout-minutes: 60
    env:
      # Debuginfo dominates target/ size; without it the workspace build fits
      # the hosted runner's disk alongside the restored cache. Backtraces in CI
      # lose line numbers, which we accept — panic messages stay intact.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # Offline from cached .debs when it can, else the mirror with retries
      # and timeouts (.github/actions/apt-install). CI runs on main only.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
          packages: >-
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache hashes member manifests + Cargo.lock only, NOT the root
          # Cargo.toml [profile.*] tables. Bump this whenever a root profile
          # changes, or a full-match restore of stale artifacts skips the
          # save and every run rebuilds (v0 -> v1: dev line-tables-only).
          prefix-key: v1-rust

      - name: Build (native crates)
        run: cargo build --workspace --exclude scuffed-app --exclude scuffed-stat-tracker --exclude scuffed-stat-tracker-core --exclude scuffed-stat-tracker-ui

      # scuffed-app was excluded here from the very first workflow commit
      # (3a4a906) — never a considered disk mitigation, just an exclusion that
      # was never revisited. Its 39 tests (undo stack, editor state, canvas
      # tools, brand/theme tokens) had therefore never run in CI.
      #
      # Note the build step above still excludes it, which is now a no-op
      # rather than a saving: `cargo test` compiles the crate it tests, so the
      # app gets built either way. Left alone to keep this diff to the one
      # thing being changed.
      - name: Test (workspace)
        run: cargo test --workspace --exclude scuffed-stat-tracker --exclude scuffed-stat-tracker-core --exclude scuffed-stat-tracker-ui

      - name: Test (api-client, native)
        run: cargo test -p scuffed-api-client --no-default-features --features native

      # Records headroom on the job that died 3x in 2 days from disk exhaustion
      # (e0d16e6). If this trends toward zero, split the app tests into their
      # own job with their own cache key rather than shrinking the budget.
      - name: Disk headroom after tests
        if: always()
        run: |
          echo "### Disk after Build & Test" >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

  app-build:
    name: App Build (Dioxus)
    needs: changes
    # Same gate as Build & Test: skip only a tracker-only pull request.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache hashes member manifests + Cargo.lock only, NOT the root
          # Cargo.toml [profile.*] tables. Bump this whenever a root profile
          # changes, or a full-match restore of stale artifacts skips the
          # save and every run rebuilds (v0 -> v1: dev line-tables-only).
          prefix-key: v1-rust

      - name: Detect cached dioxus-cli
        id: dx_cache
        run: |
          if dx --version 2>/dev/null | grep -Eq '(^|[^0-9])0\.7\.9([^0-9]|$)'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "dx 0.7.9 already installed"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "dx 0.7.9 is not installed"
          fi

      # Skipped when dx 0.7.9 is already on PATH. continue-on-error so a
      # binstall bootstrap failure still reaches the source-compile fallback.
      - name: Install cargo-binstall
        if: steps.dx_cache.outputs.hit != 'true'
        continue-on-error: true
        uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: |
          if dx --version 2>/dev/null | grep -Eq '(^|[^0-9])0\.7\.9([^0-9]|$)'; then
            echo "dx 0.7.9 already installed; skipping binstall and cargo install"
            exit 0
          fi
          # Prebuilt binary. Compile from source only if binstall fails.
          # --force covers a rust-cache restore that records the crate as
          # installed while leaving the dx binary off PATH.
          if ! cargo binstall --no-confirm --locked --force dioxus-cli@0.7.9; then
            echo "binstall failed; compiling dioxus-cli 0.7.9 from source"
            cargo install --locked dioxus-cli@0.7.9
          fi

      - name: Confirm dioxus-cli version
        run: |
          ver="$(dx --version 2>&1)"
          printf '%s\n' "$ver"
          if ! printf '%s\n' "$ver" | grep -Eq '(^|[^0-9])0\.7\.9([^0-9]|$)'; then
            echo "expected dx 0.7.9" >&2
            exit 1
          fi

      - name: Build app
        working-directory: crates/app
        # `--debug-symbols` defaults to true. wasm-opt then keeps DWARF and
        # aborts on current rustc debug info, so the shipped wasm stays huge.
        run: dx build --release --debug-symbols false

      - name: Favicon is in the dx bundle
        run: |
          test -f target/dx/scuffed-app/release/web/public/assets/favicon.svg
          test -f target/dx/scuffed-app/release/web/public/assets/favicon-32.png
          test -f target/dx/scuffed-app/release/web/public/assets/favicon.ico
          test -f target/dx/scuffed-app/release/web/public/assets/apple-touch-icon.png

  # The "Relay policy" job moved to relay.yml (OPS14) so it runs only when
  # the relay or a crate it compiles changes.
