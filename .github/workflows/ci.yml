name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  dep-guardrails:
    name: Dependency Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for non-standard frontend deps
        run: bash scripts/check-frontend-deps.sh
      - name: Check design tokens (no raw colors / legacy vars in app CSS)
        run: bash scripts/check-design-tokens.sh
      - name: Check compose files for nested interpolation
        run: bash scripts/check-compose-interpolation.sh
      - name: Backup secret restore checks
        run: |
          bash scripts/test-backup-secrets.sh
          bash scripts/test-restic-access.sh
      - name: Compose image pin and relay credential export
        run: bash scripts/test-compose-env.sh
      - name: Secrets file mode and blank keys
        run: bash scripts/test-secrets-file.sh
      - name: Relay switch preflight
        run: bash scripts/test-relay-preflight.sh
      - name: Deploy probe falls back when readiness is missing
        run: bash scripts/test-deploy-probe.sh
      - name: Relay login rollback script
        run: bash scripts/test-relay-access-down.sh

  relay-production-env:
    name: Relay production env
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PRODUCTION=1 relay env has no root password
        run: bash scripts/test-relay-production-env.sh
      - name: Pack publish script checks (fake packs, no server)
        run: bash scripts/test-publish-packs.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (native crates)
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --exclude scuffed-app \
            --exclude scuffed-stat-tracker \
            --exclude scuffed-stat-tracker-ui \
            -- -D warnings

      - name: Clippy (WASM crates)
        run: |
          cargo clippy \
            --target wasm32-unknown-unknown \
            --all-targets \
            -p scuffed-app \
            -- -D warnings

      - name: Clippy (api-client, native)
        run: |
          cargo clippy \
            -p scuffed-api-client \
            --no-default-features \
            --features native \
            --all-targets \
            -- -D warnings

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Debuginfo dominates target/ size; without it the workspace build fits
      # the hosted runner's disk alongside the restored cache. Backtraces in CI
      # lose line numbers, which we accept — panic messages stay intact.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build (native crates)
        run: cargo build --workspace --exclude scuffed-app --exclude scuffed-stat-tracker --exclude scuffed-stat-tracker-ui

      # scuffed-app was excluded here from the very first workflow commit
      # (3a4a906) — never a considered disk mitigation, just an exclusion that
      # was never revisited. Its 39 tests (undo stack, editor state, canvas
      # tools, brand/theme tokens) had therefore never run in CI.
      #
      # Note the build step above still excludes it, which is now a no-op
      # rather than a saving: `cargo test` compiles the crate it tests, so the
      # app gets built either way. Left alone to keep this diff to the one
      # thing being changed.
      - name: Test (workspace)
        run: cargo test --workspace --exclude scuffed-stat-tracker --exclude scuffed-stat-tracker-ui

      - name: Test (api-client, native)
        run: cargo test -p scuffed-api-client --no-default-features --features native

      # Records headroom on the job that died 3x in 2 days from disk exhaustion
      # (e0d16e6). If this trends toward zero, split the app tests into their
      # own job with their own cache key rather than shrinking the budget.
      - name: Disk headroom after tests
        if: always()
        run: |
          echo "### Disk after Build & Test" >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

  app-build:
    name: App Build (Dioxus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install dioxus-cli
        run: cargo install --locked dioxus-cli@0.7.9

      - name: Build app
        working-directory: crates/app
        run: dx build --release

      - name: Favicon is in the dx bundle
        run: test -f target/dx/scuffed-app/release/web/public/assets/favicon.svg

  # Builds the relay image and walks the site chat path against it.
  # A write plugin that exits (the old strfry29 command) fails this job:
  # the kind 9 publish is rejected and never comes back on the subscription.
  relay-policy:
    name: Relay policy
    runs-on: ubuntu-latest
    # Slowest green run on this branch was 27m06s (actions run 39151255510,
    # head 7f995aa, 2026-10-18). The two runs before it were 23m16s and
    # 24m36s. 40 minutes is that measurement plus about 13 minutes for a
    # cold cache. 30 is only three minutes over the slowest run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Kind 9 chat flow through the relay image
        run: bash relay/ci-chat-flow.sh
