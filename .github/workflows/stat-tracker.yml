name: Stat Tracker CI

on:
  push:
    branches: [main, "wip/0.6"]
    paths:
      # The tracker lib, the crates split out of it (stat-tracker-core, …)
      # and the GUI.
      - "crates/stat-tracker*/**"
      - "crates/types/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/stat-tracker.yml"
      - ".github/workflows/stat-tracker-release.yml"
      - ".github/actions/apt-install/**"
  pull_request:
    branches: [main, "wip/0.6"]
    paths:
      # The tracker lib, the crates split out of it (stat-tracker-core, …)
      # and the GUI.
      - "crates/stat-tracker*/**"
      - "crates/types/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/stat-tracker.yml"
      - ".github/workflows/stat-tracker-release.yml"
      - ".github/actions/apt-install/**"

# A new push to a PR cancels that PR's older run. Pushes to main group by
# commit SHA and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Every tracker crate but the GUI (0.6 N4 split). Without -p, cargo in
  # crates/stat-tracker acts on that package only, and a split-out crate's
  # tests, lints and formatting would silently not run. The fmt job checks
  # that this list names every crates/stat-tracker*/Cargo.toml but the GUI.
  TRACKER_PACKAGES: "-p scuffed-stat-tracker -p scuffed-stat-tracker-core"

defaults:
  run:
    working-directory: crates/stat-tracker

jobs:
  fmt:
    name: Rustfmt (stat-tracker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt

      - name: Every tracker crate is in TRACKER_PACKAGES
        run: |
          set -euo pipefail
          for manifest in ../stat-tracker*/Cargo.toml; do
            [[ "$manifest" == ../stat-tracker-ui/Cargo.toml ]] && continue
            name="$(awk -F'"' '/^\[package\]/ {p = 1; next} /^\[/ {p = 0} p && /^name[[:space:]]*=/ {print $2; exit}' "$manifest")"
            [[ -n "$name" ]] || { echo "no [package] name in $manifest" >&2; exit 1; }
            case " $TRACKER_PACKAGES " in
              *" -p $name "*) echo "ok: $name" ;;
              *) echo "$manifest ($name) is missing from TRACKER_PACKAGES" >&2; exit 1 ;;
            esac
          done

      - name: Rustfmt
        run: cargo fmt --check $TRACKER_PACKAGES

  build-and-test:
    name: Build & Test (stat-tracker)
    runs-on: ubuntu-latest
    # Warm runs take about 20 minutes, but a passing main push took 61
    # (job 118130839766: build 16m, test 41m) and cancelled runs 54 and 67.
    # +15 min over the old cap: on a crawling mirror a cache miss may spend
    # up to ~30 min in apt (update 2 x 300 s, install 2 x 600 s).
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Offline from cached .debs when it can, else the mirror with the
      # old retries/timeouts (.github/actions/apt-install). Ahead of
      # "Packaging scripts": with minisign installed, test-bootstrap-pin.sh
      # skips its own apt-get update + install from the mirror.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          save: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wip/0.6' }}
          packages: >-
            libwayland-dev libxkbcommon-dev
            libegl-dev libgbm-dev
            tesseract-ocr libtesseract-dev libleptonica-dev
            libevdev-dev libudev-dev
            pkg-config minisign

      - name: Packaging scripts
        run: |
          bash dist/test-packaging.sh
          bash dist/test-uninstall-paths.sh
          bash dist/test-desktop-entry.sh
          bash dist/test-systemd-unit.sh
          bash dist/test-release-notes.sh
          bash dist/test-stage-assets.sh
          bash tests/check-no-game-art.sh
          bash dist/test-tag-version.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # No `workspaces:` here. The root workspace builds into <repo>/target,
          # and the default `. -> target` caches that dir. The old
          # `crates/stat-tracker` path cached a target dir that is never built.
          # Do NOT remove this `key:`. ci.yml has jobs with the same ids
          # (`build-and-test`, `clippy`) and the same env hash, so without it
          # both workflows compute the same cache key and clobber each other.
          key: stat-tracker-build-test
          # rust-cache hashes member manifests + Cargo.lock only, NOT the root
          # Cargo.toml [profile.*] tables. Bump this whenever a root profile
          # changes, or a full-match restore of stale artifacts skips the
          # save and every run rebuilds (v0 -> v1: dev line-tables-only).
          prefix-key: v1-rust
          # Save on main and the long-lived wip/0.6 lane only: PRs into
          # wip/0.6 restore from it. Other refs would evict these (repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wip/0.6' }}

      - name: Build
        run: cargo build --locked $TRACKER_PACKAGES

      - name: Stack guard (opt-level 0)
        # `capture_futures_stay_small` guards #432: in a debug build the Tab
        # capture future runs on a test thread's 2 MiB stack, and its bounds
        # (main.rs) are opt-level 0 sizes. The Test step below builds the
        # tracker at opt-level 2, where futures and frames shrink, so this
        # one test also runs unoptimized, the way every local build runs it.
        # Costs one opt-level 0 compile of the bin test harness (~20-40 s);
        # the Build step's artifacts are not reused (dev-dependency features
        # differ). The grep fails the step if a rename leaves the filter
        # matching nothing.
        run: |
          set -o pipefail
          cargo test --locked -p scuffed-stat-tracker --bin scuffed-stat-tracker \
            -- --exact main_tests::poll_cadence::capture_futures_stay_small \
            | tee "$RUNNER_TEMP/stack-guard.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/stack-guard.log"

      - name: Test
        # No --examples: plain `cargo test` also links the 19 dev-tool
        # examples, and nothing here runs them. Clippy --all-targets still
        # checks they compile. The crate has no doctests (only ```text blocks),
        # so --lib --bins --tests covers every test it has. Same for core.
        #
        # CI builds the tracker crate at opt-level 2 for its tests: they are
        # pixel work in the crate itself (blanking, template matching, digit
        # reads). In CI the lib tests took 443 s -> 51 s, integration
        # 67 s -> 19 s, for 40 s -> 143 s of compile (opt-level 1: 120 s
        # compile, 281 s lib, so 2 it is). Local `cargo test` and the Build
        # step stay at opt-level 0. Assertions and overflow checks stay on,
        # set explicitly; line tables come from [profile.dev]. The stack
        # guard above covers the one test whose bounds are opt-level 0 sizes.
        # Core gets no override: its 200 tests take 0.06 s.
        # The per-package `--config` changes only workspace-member artifacts,
        # which rust-cache does not store; the cached deps are unchanged, so
        # this needs no prefix-key bump (unlike a root [profile.*] change).
        # The same fast full run locally:
        #   cargo test -p scuffed-stat-tracker --config 'profile.test.package.scuffed-stat-tracker.opt-level=2'
        env:
          OPT: profile.test.package.scuffed-stat-tracker
        run: >-
          cargo test --locked $TRACKER_PACKAGES --lib --bins --tests
          --config "$OPT.opt-level=2"
          --config "$OPT.debug-assertions=true"
          --config "$OPT.overflow-checks=true"

  clippy:
    name: Clippy (stat-tracker)
    runs-on: ubuntu-latest
    # +15 min over the old cap: on a crawling mirror a cache miss may spend
    # up to ~30 min in apt (update 2 x 300 s, install 2 x 600 s).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Offline from cached .debs when it can, else the mirror with the
      # old retries/timeouts (.github/actions/apt-install).
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          save: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wip/0.6' }}
          packages: >-
            libwayland-dev libxkbcommon-dev
            libegl-dev libgbm-dev
            tesseract-ocr libtesseract-dev libleptonica-dev
            libevdev-dev libudev-dev
            pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # No `workspaces:` here. The root workspace builds into <repo>/target,
          # and the default `. -> target` caches that dir. The old
          # `crates/stat-tracker` path cached a target dir that is never built.
          # Do NOT remove this `key:`. ci.yml has jobs with the same ids
          # (`build-and-test`, `clippy`) and the same env hash, so without it
          # both workflows compute the same cache key and clobber each other.
          key: stat-tracker-clippy
          # rust-cache hashes member manifests + Cargo.lock only, NOT the root
          # Cargo.toml [profile.*] tables. Bump this whenever a root profile
          # changes, or a full-match restore of stale artifacts skips the
          # save and every run rebuilds (v0 -> v1: dev line-tables-only).
          prefix-key: v1-rust
          # Save on main and the long-lived wip/0.6 lane only: PRs into
          # wip/0.6 restore from it. Other refs would evict these (repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wip/0.6' }}

      - name: Clippy
        run: cargo clippy --locked $TRACKER_PACKAGES --all-targets -- -D warnings

      # Every other step builds core together with scuffed-stat-tracker, whose
      # dependency features (tokio, chrono, ...) unify into core's. On its own,
      # core gets only the features its own Cargo.toml asks for, so a missing
      # one shows up here and nowhere else.
      - name: Clippy (stat-tracker-core on its own)
        run: cargo clippy --locked -p scuffed-stat-tracker-core --all-targets -- -D warnings

  ui-overview:
    # Iced desktop GUI (scuffed-stat-tracker-ui). Depends on the tracker lib.
    name: Build & Test (stat-tracker-ui)
    runs-on: ubuntu-latest
    # +15 min over the old cap: on a crawling mirror a cache miss may spend
    # up to ~30 min in apt (update 2 x 300 s, install 2 x 600 s).
    timeout-minutes: 55
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Offline from cached .debs when it can, else the mirror with the
      # old retries/timeouts (.github/actions/apt-install).
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          save: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wip/0.6' }}
          packages: >-
            libwayland-dev libxkbcommon-dev
            libegl-dev libgbm-dev
            tesseract-ocr libtesseract-dev libleptonica-dev
            libevdev-dev libudev-dev
            libasound2-dev libvulkan-dev libssl-dev
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
            pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: stat-tracker-ui
          # rust-cache hashes member manifests + Cargo.lock only, NOT the root
          # Cargo.toml [profile.*] tables. Bump this whenever a root profile
          # changes, or a full-match restore of stale artifacts skips the
          # save and every run rebuilds (v0 -> v1: dev line-tables-only).
          prefix-key: v1-rust
          # Save on main and the long-lived wip/0.6 lane only: PRs into
          # wip/0.6 restore from it. Other refs would evict these (repo cap).
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wip/0.6' }}

      - name: Rustfmt
        run: cargo fmt -p scuffed-stat-tracker-ui --check

      - name: Clippy
        run: cargo clippy --locked -p scuffed-stat-tracker-ui --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p scuffed-stat-tracker-ui
