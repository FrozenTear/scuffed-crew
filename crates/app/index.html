<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{app_title}</title>
    <meta charset="UTF-8" />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" />
    <meta name="description" content="A community site for teams, events, and scheduled play." />
    <meta property="og:title" content="Community" />
    <meta
      property="og:description"
      content="A community site for teams, events, and scheduled play."
    />
    <meta property="og:site_name" content="Community" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#17171d" />
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #17171d;
        color: #f4f4f8;
        font-family: system-ui, sans-serif;
      }
      #main {
        min-height: 100vh;
      }
      /* First paint before WASM boots */
      #sc-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        pointer-events: none;
        z-index: 0;
      }
      /* Fill matches BrandConfig::pending in crates/app/src/theme/brand.rs.
         assets/favicon.svg and org_favicon_data_uri use the same hex.
         The border stays lighter than the fill. */
      #sc-boot .mark {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: #808088;
        border: 1px solid #9a9aa8;
      }
      #sc-boot .label {
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9696a3;
      }
    </style>
  </head>
  <body>
    <div id="sc-boot" aria-hidden="true">
      <div class="mark"></div>
      <div class="label">Loading</div>
    </div>
    <div id="main"></div>
    <!-- Dioxus injects the WASM loader here, before the closing body tag. -->
    <script>
      // Hide boot skeleton once the app mounts content into #main
      (function () {
        var main = document.getElementById("main");
        var boot = document.getElementById("sc-boot");
        if (!main || !boot) return;
        var hide = function () {
          if (main.childElementCount > 0 || main.textContent.trim().length > 0) {
            boot.style.display = "none";
            if (obs) obs.disconnect();
          }
        };
        var obs = new MutationObserver(hide);
        obs.observe(main, { childList: true, subtree: true, characterData: true });
        // Fallback: hide after long load so we never leave a stuck overlay
        setTimeout(function () {
          boot.style.display = "none";
          if (obs) obs.disconnect();
        }, 15000);
      })();
    </script>
  </body>
</html>
