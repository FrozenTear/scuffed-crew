[package]
license.workspace = true
name = "scuffed-stat-tracker"
# Bump crates/stat-tracker-core/Cargo.toml with this line: APP_VERSION and
# USER_AGENT are built there. the_version_constants_are_this_release
# (src/tests_release_pins.rs) and dist/check-tag-version.sh fail otherwise.
version = "0.5.0"
edition = "2024"
# The oldest toolchain the locked dependencies build on (roaring needs 1.90).
rust-version = "1.90"
default-run = "scuffed-stat-tracker"

[dependencies]
scuffed-stat-tracker-core = { path = "../stat-tracker-core" }
scuffed-types = { path = "../types" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "signal",
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json"] }
# Already in the tree through reqwest/url. The report scrub matches a site
# host in both its punycode and Unicode forms.
idna = "1"
libwayshot = "0.7"
# Task 0 decision (fleet::x11-capture): pure-Rust X11; randr + image helpers.
# No shm. Closure evidence: no new native libs vs baseline.
x11rb = { version = "0.14", features = ["randr", "image"] }
ashpd = { version = "0.13", features = ["screenshot", "screencast"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# PipeWire is dlopen'd (libpipewire-0.3.so.0). Do not link it: the stat
# tracker CI image has no libpipewire-dev.
libloading = "0.8"
enumflags2 = "0.7"
leptess = "0.14"
evdev = { version = "0.13", features = ["tokio"] }
surrealdb = { version = "3", features = ["kv-surrealkv"] }
surrealdb-types = "3"
tempfile = "3"
strsim = "0.11"
rayon = "1"
sha2 = "0.10"
libc = "0.2"
regex = "1"
# Same zip crate and features as site-server (report bundles).
zip = { version = "9", default-features = false, features = ["deflate"] }

[lib]
name = "stat_tracker"
path = "src/lib.rs"

[dev-dependencies]
ab_glyph = "0.2"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "scuffed-stat-tracker"
path = "src/main.rs"
