[package]
license.workspace = true
name = "relay-policy"
version = "0.1.0"
edition = "2021"
description = "strfry write-policy plugin for Scuffed Crew relay"

[[bin]]
name = "relay-policy"
path = "src/main.rs"

[lib]
name = "relay_policy"
path = "src/lib.rs"

[[bin]]
name = "relay-read-gate"
path = "src/bin/read_gate.rs"

# CI chat-flow harness. Not part of the relay image build.
[[bin]]
name = "relay-chat-flow"
path = "src/bin/chat_flow.rs"
required-features = ["chat-flow"]

[features]
chat-flow = []

[dependencies]
scuffed-db = { path = "../db" }
httparse = "1"
ipnet = "2"
# Same floor as scuffed-chat. Signature checks for NIP-42 only; no NIP-44.
nostr = { version = "0.44.8", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { version = "3", default-features = false }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = { workspace = true }
