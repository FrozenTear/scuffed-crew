[package]
name = "scuffed-stat-tracker-ui"
version = "0.1.0"
edition = "2024"
# The oldest toolchain the locked dependencies build on (roaring needs 1.90).
rust-version = "1.90"
license.workspace = true
description = "Iced 0.14 tracker GUI for the Scuffed Crew stat tracker (Overview, Games, Heroes, Maps, Seasons, Settings, companion overlay)."

[[bin]]
name = "stat-tracker-gui"
path = "src/main.rs"

[lib]
name = "stat_tracker_ui"
path = "src/lib.rs"

[features]
default = ["companion"]
# Layer-shell overlay (`--companion`). Off only if iced_layershell cannot
# build on a host; visibility / view-model unit tests do not need it.
companion = ["dep:iced_layershell"]

[dependencies]
scuffed-stat-tracker = { path = "../stat-tracker" }
scuffed-types = { path = "../types" }
anyhow = "1"
chrono = { workspace = true }
dirs = "6"
evdev = "0.13"
gtk = "0.18"
iced = { version = "0.14", features = ["tokio", "advanced", "image", "markdown"] }
iced_layershell = { version = "0.19", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
libloading = "0.7"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb-types = "3"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.23"

# GUI build id (build.rs + src/build_id_hash.rs). Same sha2 the tracker lib
# already links, so no new crate.
[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
toml = "1"
